<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FootballFit GPS Match Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#2A2A2A; --bg2:#242424; --ink:#F2EFE9; --muted:#A6A39D; --dim:#77756F; --rule:rgba(255,255,255,.14); --rule2:rgba(255,255,255,.07);
  --peach:#1E44B0; --cream:#F4F6FB; --teal:#7C9BEA;
  --grad:linear-gradient(90deg,#1E44B0 0%,#7C9BEA 50%,#F4F6FB 100%);
  --font:'Inter','Helvetica Neue',Arial,sans-serif;
  --g1:#1E44B0; --g2:#7C9BEA; --g3:#F4F6FB; --accent:#9FB6F0;
  --sv-fg:#F4F6FB; --sv-cur:#F4F6FB; --sv-halo:#7C9BEA; --sv-dot:#8F8D88; --sv-dim:#77756F; --sv-muted:#A6A39D; --sv-grid:rgba(255,255,255,.16); --sv-griddot:rgba(255,255,255,.35); --sv-br:rgba(242,239,233,.55); --sv-bg:#2A2A2A; --tipbg:#383837;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-weight:300}
p,h1,h2,h3,ul{margin:0}
b,strong{font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px}
.eb{font-size:11px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}
.gline{height:3px;background:var(--grad)}

/* brackets */
.br{position:relative;padding:22px 26px}
.br::before,.br::after{content:"";position:absolute;top:0;bottom:0;width:9px;border:1px solid var(--sv-br);pointer-events:none}
.br::before{left:0;border-right:0}
.br::after{right:0;border-left:0}

/* hero */
.hero .wrap{padding-top:24px;padding-bottom:40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.logo img{height:21px;width:auto;display:block}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hsel,.hbtn{background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:0;padding:8px 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-weight:400}
.hsel{text-transform:none;letter-spacing:.02em;font-size:13px}
.hsel option{color:#161616}
.hbtn:hover,.hsel:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible{outline:1px solid var(--cream);outline-offset:3px}
.heroGrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:center;margin-top:40px}
.hero h1{font-size:clamp(36px,6vw,58px);line-height:1.02;font-weight:300;letter-spacing:-.02em;margin-top:16px}
.hero .sub{font-size:17px;color:var(--muted);margin-top:18px;max-width:540px;line-height:1.6}
.hero .sub b{color:var(--ink);font-weight:400}
.meta{display:flex;gap:34px;flex-wrap:wrap;margin-top:30px}
.meta div{display:flex;flex-direction:column;gap:4px}
.meta b{font-weight:300;font-size:22px;font-variant-numeric:tabular-nums}
.meta span{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.rBox{display:flex;flex-direction:column;align-items:center;gap:8px}
.rBox svg{max-width:100%;height:auto}
.rleg{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.rleg i{display:inline-block;width:18px;height:2px;margin-right:8px;vertical-align:3px}

/* sections */
main{padding-bottom:40px}
.sec{border-top:1px solid var(--rule);padding-top:36px;margin-top:44px}
.sec.first{border-top:0;margin-top:20px;padding-top:0}
.h2{font-size:28px;font-weight:300;letter-spacing:-.01em;margin-top:12px}
.lead{color:var(--muted);margin-top:10px;max-width:640px;font-size:14.5px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:28px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font-size:44px;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;margin-top:10px}
.tile .v small{font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:.12em;font-weight:300}
.word{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.word.best{color:var(--accent);font-weight:600}
.tile svg{width:100%;height:auto;display:block;margin-top:12px}
.keyrow{display:flex;gap:26px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:22px}
.keyrow i{display:inline-block;vertical-align:-2px;margin-right:8px}

/* compare */
.crow{display:grid;grid-template-columns:190px minmax(0,1fr) 40px;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule2)}
.crow:last-child{border-bottom:0}
.crow .lab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{position:relative;height:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar.prev{height:2px}.bar.prev i{background:var(--sv-dot)}
.bar.now i{background:var(--grad);box-shadow:0 0 14px rgba(124,155,234,.25)}
.bar span{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px;color:var(--dim)}
.bar.now span{color:var(--ink);font-size:13px}
.arr{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.arr.up{border-color:var(--ink);color:var(--ink)}
.cleg{display:flex;gap:26px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.cleg i{display:inline-block;width:22px;margin-right:8px;vertical-align:3px}

/* big chart */
.tabsm{display:flex;gap:0;flex-wrap:wrap;margin-top:24px;border-bottom:1px solid var(--rule)}
.tabsm button{border:0;background:transparent;padding:10px 16px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabsm button[aria-pressed="true"]{color:var(--ink);border-image:var(--grad) 1;border-bottom:2px solid}
.bigc svg{width:100%;height:auto;display:block;margin-top:16px}
.note{font-size:12.5px;color:var(--dim);margin-top:10px}

/* speed */
.speedRow{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;margin-top:28px;align-items:stretch}
.dots{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sd{width:34px;height:34px;border-radius:50%;border:1px solid #5E5C58;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.sd.hit{background:var(--grad);border-color:transparent;color:#0E1A3A;font-weight:600}
.sd.cur{box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--ink)}

/* bests */
.bests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:28px}
.bst{display:flex;flex-direction:column;gap:6px}
.bst b{font-size:30px;font-weight:200;font-variant-numeric:tabular-nums;margin-top:6px}
.bst b small{font-size:12px;color:var(--muted);margin-left:5px;letter-spacing:.12em}
.bst span{font-size:12px;color:var(--dim)}
.bst .new{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600}

/* raw log */
details.raw{margin-top:40px;border-top:1px solid var(--rule);padding-top:20px}
details.raw summary{cursor:pointer;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);list-style:none}
details.raw summary::-webkit-details-marker{display:none}
.log{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.log th{font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:right;padding:0 8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.log th:first-child{text-align:left}
.log td{padding:10px 8px;border-bottom:1px solid var(--rule2);text-align:right;font-variant-numeric:tabular-nums}
.log td:first-child{text-align:left}
.log tr.cur td{background:rgba(242,237,227,.06)}
.tblwrap{overflow-x:auto}

/* data */
.data{margin-top:50px;border-top:1px solid var(--rule);padding:26px 0 60px}
.data summary{cursor:pointer;font-size:16px;list-style:none;font-weight:300}
.data summary::-webkit-details-marker{display:none}
.data summary .eb{display:block;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.slot{border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot h4{margin:0;font-size:13px;font-weight:500}
.slot label,.fld label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.slot input[type=text],.slot textarea,.fld input{width:100%;border:1px solid var(--rule);padding:8px 10px;font-size:13px;background:var(--bg2);color:var(--ink)}
.slot textarea{min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;resize:vertical}
.slot input[type=file]{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{background:var(--ink);color:#1d1d1d;border:1px solid var(--ink);padding:10px 18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.msg{font-size:13px;color:var(--muted)} .msg.err{color:var(--peach)} .msg.ok{color:#9FB6F0}
.fld{display:flex;flex-direction:column;gap:6px;max-width:340px;margin-top:18px}
.pill{display:inline-block;padding:2px 9px;font-size:11.5px;margin:2px 4px 2px 0;border:1px solid var(--rule);color:var(--muted)}
.pill.found{border-color:#7C9BEA;color:#9FB6F0} .pill.missing{border-color:var(--peach);color:var(--peach)}
.ckbox{border:1px solid var(--rule);padding:14px;margin-top:14px;font-size:13px}

footer{padding:22px 0 26px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
footer img{height:14px;width:auto;display:block}
#tip{position:fixed;pointer-events:none;background:#F2EFE9;color:#1d1d1d;font-size:12px;line-height:1.45;padding:8px 11px;max-width:240px;z-index:90;opacity:0;transition:opacity .1s;white-space:pre-line}
#tip.on{opacity:1}

@media (max-width:820px){
  .heroGrid,.speedRow,.slots{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .bests{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crow{grid-template-columns:100px minmax(0,1fr) 30px;gap:12px}
  .br{padding:18px 20px}
}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:var(--bg)!important}
  .ctrls,.data,.tabsm,#tip,details.raw{display:none!important}
  .tile,.crow,.bst,.speedRow,.bigc{break-inside:avoid}
  .eb,.h2,.lead{break-after:avoid}
  body.pall #app{display:none}
  body.pall #printAll{display:block}
  #printAll .ppage{break-after:page}
  #printAll .ppage:last-child{break-after:auto}
  .wrap{max-width:none;padding-left:18px;padding-right:18px}
  .heroGrid{grid-template-columns:minmax(0,1fr) 270px!important;gap:20px;margin-top:20px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px}
  .tile .v{font-size:32px}
  .bests{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .speedRow{grid-template-columns:210px minmax(0,1fr)!important}
  .sec{margin-top:24px;padding-top:20px}
  body{font-size:13px}
  .word.best,.bst .new{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#8FA9EE!important}
}
#printAll{display:none}
/* ===== Hintsa-format sheets ===== */
.hero .wrap{padding-bottom:76px}
.sheet{position:relative;border-radius:30px 30px 0 0;margin-top:-30px;padding:60px 0 84px;box-shadow:0 -14px 34px rgba(0,0,0,.28)}
.sheet.dark{background:#2A2A2A;--sv-bg:#2A2A2A}
.sheet.light{background:#F7F6F2;color:#161616;
  --ink:#161616; --muted:#5F5D58; --dim:#8A8883; --rule:rgba(0,0,0,.12); --rule2:rgba(0,0,0,.07); --bg:#F7F6F2;
  --grad:linear-gradient(90deg,#1E44B0 0%,#4F74DB 55%,#A9BEF2 100%); --g1:#1E44B0; --g2:#4F74DB; --g3:#A9BEF2; --accent:#1E44B0;
  --sv-fg:#161616; --sv-cur:#1E44B0; --sv-halo:#1E44B0; --sv-dot:#B9B6AF; --sv-dim:#9A9892; --sv-muted:#6B6964; --sv-grid:rgba(0,0,0,.1); --sv-griddot:rgba(0,0,0,.28); --sv-br:rgba(22,22,22,.4); --sv-bg:#F7F6F2; --tipbg:#ECEAE4}
.sheet.light .sd.hit{color:#fff}
.sheet.light .bar.now i{box-shadow:none}
.sheet.light .tabsm button[aria-pressed="true"]{color:#161616}
.shead{display:flex;align-items:center;gap:12px}
.ico{width:26px;height:26px;color:var(--ink)}
.sheet .h2{font-size:34px;margin-top:14px;letter-spacing:-.015em}
.intro{font-size:19px;line-height:1.5;color:var(--ink);max-width:700px;margin-top:14px;font-weight:300}
.tipb{display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;align-items:center;background:var(--tipbg);border-radius:14px;padding:20px 22px;margin-top:30px;color:var(--ink)}
.tipb p{font-size:15px;line-height:1.55}
.tipb b{font-weight:600}
.cmpbox{margin-top:28px}
.crow{border-bottom:1px dashed var(--rule)!important}
.crow:last-child{border-bottom:0!important}
.kd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sv-dot);vertical-align:0}
.kd.cur{width:12px;height:12px;background:var(--sv-cur);vertical-align:-1px}
.ka{display:inline-block;width:0;height:13px;border-left:1px dashed var(--sv-fg);vertical-align:-2px}
.cleg i.lp{display:inline-block;width:22px;height:2px;background:var(--sv-dot)}
.cleg i.ln2{display:inline-block;width:22px;height:5px;border-radius:3px;background:var(--grad)}
.rawsheet{padding-bottom:50px}
.rawsheet details.raw{margin-top:0;border-top:0;padding-top:0}
.data{border-top:0;margin-top:0}
.sheet + section .data, #main + section{position:relative}
@media (max-width:820px){.sheet{border-radius:22px 22px 0 0;margin-top:-22px;padding:44px 0 64px}.sheet .h2{font-size:27px}.intro{font-size:17px}}
@media print{.rawsheet{display:none!important}.sheet{box-shadow:none;break-inside:auto}.tipb{break-inside:avoid}.sheet{padding:40px 0 56px}}

</style>
</head>

<script>
/* ================= Schemas ================= */
const ATH_FIELDS=[
  {key:"id",label:"ID",aliases:["id","playerid","athleteid"]},
  {key:"name",label:"Name",required:true,aliases:["name","player","athlete","playername","fullname"]},
  {key:"position",label:"Position",aliases:["position","pos","role"]},
  {key:"birthdate",label:"Birthdate",aliases:["birthdate","dob","dateofbirth"]},
  {key:"age",label:"Age",aliases:["age"],num:true},
  {key:"height_cm",label:"Height (cm)",aliases:["heightcm","height","ht"],num:true},
  {key:"weight_kg",label:"Weight (kg)",aliases:["weightkg","weight","wt","mass"],num:true},
  {key:"injury_hx",label:"Injury history",aliases:["injuryhx","injuryhistory","injuries","history"]},
];
const GPS_FIELDS=[
  {key:"date",label:"Date",required:true,aliases:["date","sessiondate","day"]},
  {key:"player",label:"Player",required:true,aliases:["player","name","athlete","playername"]},
  {key:"id",label:"ID",aliases:["id","playerid","athleteid"]},
  {key:"session_type",label:"Session type",aliases:["sessiontype","session","type","md","mdcode"]},
  {key:"session_name",label:"Session name",aliases:["sessionname","matchname","fixture","opponent","gamelabel","label","game","match","matchtitle"]},
  {key:"total_duration_min",label:"Duration",aliases:["totalduration","duration","durationmin","mins","minutes","totaldurationmin"],num:true},
  {key:"total_distance",label:"Total distance",required:true,aliases:["totaldistance","td","distance","totdist","totaldist"],num:true},
  {key:"dist_per_min",label:"Dist/min",aliases:["distpermin","distanceperminute","mpermin","mmin","totdistpermin","totdistanceperminute","totdistanceperminutem","totaldistanceperminute","distperminm"],num:true},
  {key:"hsr_19_8",label:"HSR >19.8",required:true,aliases:["hsr198","hsr","highspeedrunning","hsrd","hsr198km","highspeeddistance","hsrdistance"],num:true},
  {key:"hsr_per_min",label:"HSR/min",aliases:["hsrpermin","hsrperminute","hsrmin"],num:true},
  {key:"sprint_efforts",label:"Sprint efforts",aliases:["sprintefforts","sprints","sprinteffs","sprintcount","noofsprints"],num:true},
  {key:"sprint_distance",label:"Sprint distance",aliases:["sprintdistance","sprintdist","sprintdistancem"],num:true},
  {key:"accel_decel_count",label:"Accel/decel",aliases:["acceldecelcount","acceldecel","accdec","accelerations","decelerations","hiaccdec","accdeccount"],num:true},
  {key:"max_velocity",label:"Max velocity",aliases:["maxvelocity","maxvel","maxspeed","topspeed","vmax"],num:true},
  {key:"max_vel_pct",label:"Max vel %",aliases:["maxvelpct","maxvelmax","pctmaxvel","maxvelpercent","percentmaxvelocity","maxvelofmax"],num:true},
  {key:"hr_avg",label:"HR avg",aliases:["hravg","avghr","averageheartrate","hrmean"],num:true},
  {key:"hr_max",label:"HR max",aliases:["hrmax","maxhr","maxheartrate"],num:true},
  {key:"heart_exertion",label:"Heart exertion",aliases:["heartexertion","exertion","hrexertion","heartload","hrload"],num:true},
];
const RES_FIELDS=[
  {key:"name",label:"Name",required:true,aliases:["name","player","athlete","playername","fullname"]},
  {key:"max_vel_ms",label:"Max vel (m/s)",required:true,num:true,aliases:["maxvelms","maxvelocityms","maxspeedms","topspeedms","maxvel","maxvelocity","topspeed","vmax"]},
];

/* ================= Helpers ================= */
const $=id=>document.getElementById(id);
const norm=s=>(s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toNumber(v){if(v==null||v==="")return null;const n=parseFloat(v.toString().replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function sd(a){if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.map(v=>(v-m)**2).reduce((x,y)=>x+y,0)/a.length);}
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;}
const fmt=(n,d=0)=>n==null||isNaN(n)?"—":Number(n).toLocaleString("en-AU",{minimumFractionDigits:d,maximumFractionDigits:d});
const pctS=r=>r==null||!isFinite(r)?"—":(r>=0?"+":"−")+Math.abs(Math.round(r*100))+"%";
const fdate=s=>{const d=parseDate(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):(s||"—");};
const fdateL=s=>{const d=parseDate(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):(s||"");};
const slug=s=>norm(s).slice(0,40)||"x";
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
function store(k,v){try{localStorage.setItem("ffgpsr_"+k,v)}catch(e){}}
function load(k){try{return localStorage.getItem("ffgpsr_"+k)}catch(e){return null}}
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function buildMapping(fields,headers){const mapping={},used=new Set();
  fields.forEach(f=>{const wanted=[f.key,...f.aliases].map(norm);const hit=headers.find(h=>!used.has(h)&&wanted.includes(norm(h)));if(hit){mapping[f.key]=hit;used.add(hit);}});
  return {mapping,unmatched:headers.filter(h=>!used.has(h))};}
function normalizeRows(fields,raw,mapping){return raw.map(r=>{const o={};fields.forEach(f=>{const v=mapping[f.key]?r[mapping[f.key]]:null;o[f.key]=f.num?toNumber(v):(v==null?null:v.toString().trim());});return o;});}
function intensityOf(m){if(!m)return null;if(m.hsr_per_min!=null)return m.hsr_per_min;if(m.hsr_19_8!=null&&m.total_duration_min)return m.hsr_19_8/m.total_duration_min;return null;}
function dpmOf(m){if(m.dist_per_min!=null)return m.dist_per_min;if(m.total_distance!=null&&m.total_duration_min)return m.total_distance/m.total_duration_min;return null;}
function sessLabel(m){if(!m)return "—";const n=m.session_name&&(""+m.session_name).trim();if(n)return n;const t=m.session_type&&(""+m.session_type).trim();return t||fdate(m.date);}

/* metrics shown to the player */
const METRICS=[
  {k:"min",l:"Minutes played",nopb:true,g:x=>x.total_duration_min,u:" min",d:0,ex:"Time on the pitch."},
  {k:"dist",l:"Total distance",g:x=>x.total_distance,u:" m",d:0,ex:"Everything you covered: your overall running volume."},
  {k:"dpm",l:"Metres per minute",g:dpmOf,u:" m/min",d:0,ex:"Distance per minute played: your work rate, whatever your minutes."},
  {k:"hsr",l:"High-speed running",g:x=>x.hsr_19_8,u:" m",d:0,ex:"Metres above 19.8 km/h."},
  {k:"hpm",l:"HSR per minute",s:"HSR per minute",g:intensityOf,u:" m/min",d:1,ex:"High-speed metres per minute played: the intensity of your match."},
  {k:"spr",l:"Sprint distance",g:x=>x.sprint_distance,u:" m",d:0,ex:"Metres at sprint speed: your top-end output."},
  {k:"sprn",l:"Sprint efforts",g:x=>x.sprint_efforts,u:"",d:0,ex:"Number of separate sprints."},
  {k:"acc",l:"Accels & decels",g:x=>x.accel_decel_count,u:"",d:0,ex:"Hard speed-ups and slow-downs: the stop-start load that distance misses."},
  {k:"vmax",l:"Top speed",g:x=>x.max_velocity,u:" km/h",d:1,ex:"Fastest speed reached in the match."},
  {k:"vpct",l:"% of your max speed",g:x=>x.max_vel_pct,u:"%",d:0,ex:"Top speed in the match as a share of your tested max."},

  <section class="sec first">${secHead("demands","Match demands",`Your numbers ${esc(opp(m))}`,"Each line runs from your lowest to your best match this season. The bright dot is this match.")}
    <div class="tiles">${core.map(x=>{const s=stat(ms,x.g,idx);if(!s)return "";return `<div class="tile br"><div class="eb">${x.l}</div><div class="v">${fmt(s.cur,x.d)}<small>${x.u.toUpperCase()}</small></div>${word(s)}${strip(ms,idx,x.g)}</div>`;}).join("")}</div>
    <div class="keyrow"><span><i class="kd cur"></i>This match</span><span><i class="kd"></i>Other matches</span><span><i class="ka"></i>Your average</span></div>
    ${tipBox(demandTip(ms,idx,core))}
  </section>

  ${prev?`<section class="sec">${secHead("match","Match to match",`Compared with your last match ${esc(opp(prev))}`,"")}
    <div class="cmpbox"><div class="cleg"><span><i class="lp"></i>${esc(sessLabel(prev))}</span><span><i class="ln2"></i>${esc(sessLabel(m))}</span></div>
    ${[{l:"Minutes",g:x=>x.total_duration_min,u:"min",d:0}].concat(core).map(x=>{const a=x.g(prev),b=x.g(m);if(a==null||b==null)return "";
      const best=Math.max(...ms.map(x.g).filter(v=>v!=null)),pa=a/best*72,pb=b/best*72,up=b>a*1.005,dn=b<a*.995;
      return `<div class="crow"><div class="lab">${x.l}</div><div class="bars"><div class="bar prev"><i style="width:${pa.toFixed(1)}%"></i><span style="left:${pa.toFixed(1)}%">${fmt(a,x.d)}</span></div><div class="bar now"><i style="width:${pb.toFixed(1)}%"></i><span style="left:${pb.toFixed(1)}%">${fmt(b,x.d)} <small style="color:var(--dim);letter-spacing:.12em">${x.u.toUpperCase()}</small></span></div></div><div class="arr ${up?"up":""}">${up?"▲":dn?"▼":"="}</div></div>`;}).join("")}
    </div>${tipBox(compareTip(prev,m,core))}</section>`:""}

  <section class="sec">${secHead("season","Your season","How your season is building","Every match so far this season, one line per metric. Pick a metric to see where this match sits.")}
    <div class="tabsm">${bigOpts.map(x=>`<button data-big="${x.k}" aria-pressed="${x.k===mt.k}">${x.l}</button>`).join("")}</div>
    <div class="bigc">${bigChart(ms,idx,mt)}</div>
    ${tipBox(seasonTip(ms,idx,mt))}
  </section>

  ${hasVp?`<section class="sec">${secHead("speed","Speed","Reaching top speed","Hitting 90% or more of your max speed keeps you quick and protects your hamstrings. A filled circle means you got there in that match.")}
    <div class="speedRow"><div class="br"><div class="eb">Matches at 90%+</div><div style="font-size:52px;font-weight:200;line-height:1;margin-top:14px">${exp}<span style="font-size:15px;color:var(--muted);margin-left:8px">/ ${expN}</span></div>${topRow?`<div class="word" style="margin-top:14px">Fastest · <span style="color:var(--ink)">${fmt(topRow.max_velocity,1)} km/h</span></div>`:""}</div>
    <div class="br" style="display:flex;flex-direction:column;justify-content:center"><div class="dots">${upto.map((x,i)=>`<div class="sd${x.max_vel_pct!=null&&x.max_vel_pct>=90?" hit":""}${i===idx?" cur":""}" data-tip="${esc(sessLabel(x))} · ${fdate(x.date)}\n${x.max_vel_pct!=null?fmt(x.max_vel_pct)+"% of max":"no data"}">${i+1}</div>`).join("")}</div><p class="note">Match 1 to ${idx+1}. The ringed circle is this match.</p></div></div>
    ${tipBox(speedTip(upto))}
  </section>`:""}

  <section class="sec">${secHead("bests","Season bests","Your numbers to beat","")}
    <div class="bests">${bestCards.map(o=>`<div class="bst br">${o.now?`<span class="new">★ New this match</span>`:`<span class="eb" style="font-size:9.5px">${o.x.l}</span>`}${o.now?`<span class="eb" style="font-size:9.5px">${o.x.l}</span>`:""}<b>${fmt(o.v,o.x.d)}<small>${o.x.u.toUpperCase()}</small></b><span>${esc(sessLabel(o.r))}</span></div>`).join("")}</div>
  </section>

  <details class="raw"><summary>Show all match data</summary><div class="tblwrap"><table class="log"><thead><tr><th>Match</th><th>Min</th><th>Distance</th><th>HSR</th><th>Sprint</th><th>Top speed</th></tr></thead><tbody>
    ${ms.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<tr class="${i===idx?"cur":""}"><td>${esc(sessLabel(x))} <span style="color:var(--dim);font-size:12px">${fdate(x.date)}</span></td><td>${fmt(x.total_duration_min)}</td><td>${fmt(x.total_distance)}</td><td>${fmt(x.hsr_19_8)}</td><td>${fmt(x.sprint_distance)}</td><td>${fmt(x.max_velocity,1)}</td></tr>`).join("")}
  </tbody></table></div></details>`);
  const coachN=($("coachName").value||"").trim();$("footCoach").textContent=coachN?"Physical Performance Coach · "+coachN:"Individual physical performance coaching";
}
function emptyView(){
  $("pSel").hidden=$("mSel").hidden=$("btnPrint").hidden=$("btnPrintAll").hidden=true;
  $("heroBody").innerHTML=`<div class="heroGrid" style="grid-template-columns:1fr"><div><div class="eb">GPS match report</div><h1>Connecting to your sheet…</h1><p class="sub" id="emptySub">Pulling Athletes, GPS Data and Results from your Google Sheet.</p><div class="btns"><button class="btn" id="heroSync" type="button">Sync from sheet</button><button class="btn ghost" id="heroEx" type="button">Load example squad</button></div></div></div>`;
  $("main").innerHTML="";$("heroEx").onclick=loadExample;$("heroSync").onclick=()=>syncSheet(false);const lm=$("loadMsg");if(lm&&lm.classList.contains("err")){$("emptySub").textContent=lm.textContent;document.querySelector(".hero h1").textContent="Couldn\u2019t load your sheet yet.";}
}

/* ================= Data build ================= */
function parseCsv(txt){const r=Papa.parse((txt||"").trim(),{header:true,skipEmptyLines:true});return {data:r.data,fields:r.meta.fields||[]};}
function build(src){
  const ath=parseCsv(src.ath),gps=parseCsv(src.gps),res=src.res&&src.res.trim()?parseCsv(src.res):null;
  const aMap=buildMapping(ATH_FIELDS,ath.fields),gMap=buildMapping(GPS_FIELDS,gps.fields);
  const athletes=normalizeRows(ATH_FIELDS,ath.data,aMap.mapping).filter(r=>r.name);
  const sessions=normalizeRows(GPS_FIELDS,gps.data,gMap.mapping).filter(r=>r.player&&r.date);
  const maxMap={};let rMap=null;
  if(res){rMap=buildMapping(RES_FIELDS,res.fields);normalizeRows(RES_FIELDS,res.data,rMap.mapping).forEach(r=>{if(r.name&&r.max_vel_ms>0){const k=norm(r.name);if(!maxMap[k]||r.max_vel_ms>maxMap[k])maxMap[k]=r.max_vel_ms;}});}
  const byName={},byId={};athletes.forEach(a=>{byName[norm(a.name)]=a;if(a.id)byId[norm(a.id)]=a;});
  const unmatched=new Set();let computed=0;
  const joined=sessions.map(s=>{const a=(s.id&&byId[norm(s.id)])||byName[norm(s.player)]||null;if(!a)unmatched.add(s.player);
    let mvp=s.max_vel_pct;const t=maxMap[norm(s.player)];if(mvp==null&&t&&s.max_velocity!=null){mvp=Math.round((s.max_velocity/3.6)/t*1000)/10;computed++;}
    return Object.assign({},s,{max_vel_pct:mvp,position:a?a.position:null,age:a?a.age:null});});
  DATA={joined,maxMap,players:[...new Set(joined.map(j=>j.player))]};
  const matched=joined.filter(j=>j.position!=null||j.age!=null).length;
  const pills=(F,M)=>F.map(f=>M.mapping[f.key]?`<span class="pill found">${f.label} ✓</span>`:`<span class="pill ${f.required?"missing":""}">${f.label}${f.required?" ✗ required":" —"}</span>`).join("")+M.unmatched.map(u=>`<span class="pill">${esc(u)} (ignored)</span>`).join("");
  $("checks").innerHTML=`<div class="ckbox"><div class="eb">Join result</div><div style="margin-top:6px">${athletes.length} athletes · ${sessions.length} GPS rows · ${matched}/${sessions.length} matched to a profile${res?` · % of max speed computed for ${computed} matches`:""}</div>
    ${unmatched.size?`<div class="note" style="color:var(--goldInk)">⚠ GPS rows with no matching profile: ${[...unmatched].map(esc).join(", ")}</div>`:""}
    <div class="eb" style="margin-top:12px">Athletes columns</div><div>${pills(ATH_FIELDS,aMap)}</div><div class="eb" style="margin-top:8px">GPS columns</div><div>${pills(GPS_FIELDS,gMap)}</div>${rMap?`<div class="eb" style="margin-top:8px">Results columns</div><div>${pills(RES_FIELDS,rMap)}</div>`:""}</div>`;
}

/* ================= Events ================= */
$("pSel").addEventListener("change",e=>{SEL=e.target.value;MIDX=null;setHash();render();});
$("mSel").addEventListener("change",e=>{MIDX=+e.target.value;render();});
document.addEventListener("click",e=>{const mt=e.target.closest("[data-big]");if(mt){BIG=mt.dataset.big;const y=window.scrollY;render();window.scrollTo(0,y);}});
const tip=$("tip");
document.addEventListener("pointerover",e=>{const t=e.target.closest("[data-tip]");if(!t){tip.classList.remove("on");return;}tip.textContent=t.getAttribute("data-tip");tip.classList.add("on");});
document.addEventListener("pointermove",e=>{if(!tip.classList.contains("on"))return;const x=Math.min(window.innerWidth-tip.offsetWidth-10,e.clientX+14),y=e.clientY+16+tip.offsetHeight>window.innerHeight?e.clientY-tip.offsetHeight-12:e.clientY+16;tip.style.left=x+"px";tip.style.top=y+"px";});
function setHash(){try{history.replaceState(null,"","#player-"+slug(SEL));}catch(e){}}
function fromHash(){const h=(location.hash||"").slice(1);if(h.startsWith("player-")){const p=DATA.players.find(x=>slug(x)===h.slice(7));if(p)SEL=p;}}
window.addEventListener("hashchange",()=>{fromHash();MIDX=null;render();});
$("btnPrint").addEventListener("click",()=>{try{window.print()}catch(e){}});
$("btnPrintAll").addEventListener("click",()=>{
  const keep=SEL,keepM=MIDX,pages=[];
  DATA.players.slice().sort().forEach(p=>{SEL=p;MIDX=null;render();pages.push(`<div class="ppage"><header class="hero"><div class="wrap">${document.querySelector(".topbar").outerHTML}${$("heroBody").innerHTML}</div></header><main>${$("main").innerHTML}</main></div>`);});
  $("printAll").innerHTML=pages.join("");document.body.classList.add("pall");SEL=keep;MIDX=keepM;render();
  setTimeout(()=>{try{window.print()}catch(e){}},80);
});
window.addEventListener("afterprint",()=>{document.body.classList.remove("pall");$("printAll").innerHTML="";});

/* ================= Google Sheet sync ================= */
const DEFAULT_SHEET="1OBjzQmeFLxI75vu4h-tJen8gsgoG3F5RaW8UNhCKXcc";
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const sheetIdOf=s=>{s=(s||"").trim();const m=s.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:s;};
let MCP;const mcpReady=(window.claude&&window.claude.use)?window.claude.use("mcp").catch(()=>null):Promise.resolve(null);
function setStatus(t,cls){const m=$("loadMsg");m.className="msg"+(cls?" "+cls:"");m.textContent=t;const b=$("btnSyncTop");if(b)b.textContent=t.length<28?t:(cls==="err"?"Sync failed":"Sync");}
function findB64(r){let p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
  if(p&&typeof p==="object"&&p.content)return p.content;
  for(const b of (r&&r.content)||[]){if(b.type==="text"){try{const j=JSON.parse(b.text);if(j.content)return j.content;}catch(e){}}}
  return null;}
function tabCsv(wb,name){if(!name)return "";const n=wb.SheetNames.find(s=>s.trim().toLowerCase()===name.trim().toLowerCase());return n?XLSX.utils.sheet_to_csv(wb.Sheets[n],{dateNF:"yyyy-mm-dd",blankrows:false}):null;}
async function viaDrive(id){
  const r=await MCP.callTool("Google Drive","download_file_content",{fileId:id,exportMimeType:XLSX_MIME},{cache:false});
  const b64=findB64(r);if(!b64)throw {code:"tool_error",message:"The sheet came back empty."};
  const wb=XLSX.read(b64,{type:"base64",cellDates:true});
  const ath=tabCsv(wb,$("athTab").value),gps=tabCsv(wb,$("gpsTab").value),res=tabCsv(wb,$("resTab").value);
  if(gps==null)throw {code:"no_tab",message:`No tab called "${$("gpsTab").value}". Tabs found: ${wb.SheetNames.join(", ")}.`};
  return {ath:ath||"",gps,res:res||""};
}
async function viaGviz(id){
  const get=async tab=>{if(!tab)return "";const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`,{cache:"no-store"});if(!r.ok)throw {code:"http",message:"HTTP "+r.status};return r.text();};
  const [ath,gps,res]=await Promise.all([get($("athTab").value.trim()),get($("gpsTab").value.trim()),get($("resTab").value.trim()).catch(()=>"")]);
  return {ath,gps,res};
}
const SYNC_MSG={
  needs_reauth:"Google Drive needs reconnecting: claude.ai Settings → Connectors.",
  server_not_connected:"Connect Google Drive in claude.ai Settings → Connectors, then press Sync.",
  selection_required:"Choose which Google Drive connection to use in the prompt, then press Sync.",
  not_in_manifest:"Google Drive access was declined for this page. Press Sync to allow it.",
  approval_required:"Press Sync and approve Google Drive access to load your sheet.",
  blocked_by_policy:"Your organisation blocks Google Drive for this page.",
  server_unavailable:"Google Drive didn't answer. Press Sync to try again.",
};
async function syncSheet(auto){
  const id=sheetIdOf($("sheetId").value);if(!id){setStatus("Add your sheet link first.","err");return false;}
  store("sheetId",id);setStatus("Syncing…");
  MCP=await mcpReady;
  try{
    const src=MCP?await viaDrive(id):await viaGviz(id);
    if(!src.gps||!src.gps.trim())throw {code:"no_tab",message:"The GPS tab came back empty."};
    store("src",JSON.stringify(src));store("ex","0");build(src);if(!auto){SEL=null;MIDX=null;}render();
    setStatus(`Synced ${new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"})}`,"ok");return true;
  }catch(e){
    const c=e&&e.code;let t=SYNC_MSG[c]||(c==="tool_error"?"Google Drive couldn't open that sheet. Check the link and that this Google account can see it.":c==="no_tab"?e.message:
      MCP?("Couldn't sync: "+((e&&e.message)||c||"unknown error")):(framed?"Sheet sync needs the Google Drive connection here. Press Sync again, or use CSV files.":"Couldn't reach the sheet. Share it as \"Anyone with the link can view\", then press Sync."));
    setStatus(t,"err");if(!DATA.players.length)render();return false;
  }
}
["ath","gps","res"].forEach(k=>{
  $(k+"File").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(t=>{$(k+"Paste").value=t;});});
  const el=$(k+"Tab"),v=load(k+"Tab");if(v!=null)el.value=v;el.addEventListener("change",()=>store(k+"Tab",el.value.trim()));
});
$("sheetId").value=load("sheetId")||DEFAULT_SHEET;
$("btnSync").addEventListener("click",()=>syncSheet(false));
$("btnSyncTop").addEventListener("click",()=>syncSheet(false));
$("btnCsv").addEventListener("click",()=>{const src={ath:$("athPaste").value,gps:$("gpsPaste").value,res:$("resPaste").value};
  if(!src.gps.trim()){setStatus("Add the GPS CSV first.","err");return;}store("src",JSON.stringify(src));store("ex","0");build(src);SEL=null;MIDX=null;render();setStatus(`Loaded ${DATA.players.length} players from CSV.`,"ok");});
$("btnEx").addEventListener("click",loadExample);
$("coachName").value=load("coach")||"";
$("coachName").addEventListener("input",e=>{store("coach",e.target.value.trim());render();});
$("frameNote").innerHTML="The report pulls straight from your Google Sheet: Athletes, GPS Data and the Results tab for tested max speed. Here on claude.ai it reads the sheet through your Google Drive connection, and asks once for access. As a hosted HTML file it reads the sheet directly, which needs the sheet shared as \"Anyone with the link can view\". It syncs every time the report opens.";

/* ================= Example squad (fictional) ================= */
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function exampleCsv(){
  const R=rng(7),N=(m,s)=>m+(R()+R()+R()-1.5)*s*1.15;
  const fixtures=["vs Harbour City","at Northbridge","vs Eastvale","at Port Ridge","vs Kingsley FC","at Westmoor","vs Riverside","at Lakeport","vs Southgate","at Hillcrest","vs Bayview","at Granite Utd"];
  const dates=[];let d=new Date("2026-08-02");fixtures.forEach((_,i)=>{dates.push(new Date(d));d.setDate(d.getDate()+(i===7?3:7));});
  const P=[["Lucas Berg","CM",24,122,8.6,.22,9.1],["Ari Mäkelä","W",21,116,11.2,.32,9.6],["Tom Okafor","FB",26,114,10.1,.28,9.4],["Joel Lind","CB",28,104,5.6,.18,8.9],["Sami Haddad","ST",23,108,8.9,.3,9.3],["Noel Varga","W",25,117,11.6,.34,9.7]];
  const ath=[["id","name","position","age"]],gps=[["date","player","session_type","session_name","total_duration_min","total_distance","hsr_19_8","sprint_efforts","sprint_distance","accel_decel_count","max_velocity","hr_avg"]],res=[["player","max_vel_ms"]];
  P.forEach(([n,pos,age,dpm0,hpm0,spr,vmax],pi)=>{ath.push([pi+1,n,pos,age]);res.push([n,vmax]);
    fixtures.forEach((f,i)=>{let mins=Math.round(Math.min(96,N(90,3)));if(pi===2&&i===6)mins=62;if(pi===4&&(i===3||i===9))mins=70;
      const hpm=N(hpm0,hpm0*.1),dpm=N(dpm0,5),pct=Math.min(.99,N(.91,.035));const hsr=Math.round(hpm*mins);const sd_=Math.round(hsr*N(spr,.03));
      gps.push([dates[i].toISOString().slice(0,10),n,"Match",f,mins,Math.round(dpm*mins),hsr,Math.max(1,Math.round(sd_/24)),sd_,Math.round(N(68,7)*mins/90),+(vmax*3.6*pct).toFixed(1),Math.round(N(165,3))]);});});
  return {ath:Papa.unparse(ath),gps:Papa.unparse(gps),res:Papa.unparse(res)};
}
function loadExample(){const s=exampleCsv();$("athPaste").value=s.ath;$("gpsPaste").value=s.gps;$("resPaste").value=s.res;store("src",JSON.stringify(s));build(s);SEL=null;MIDX=null;render();store("ex","1");setStatus("Example squad loaded (fictional players). Press Sync to go back to your sheet.","ok");}

(function start(){
  let src=null;try{src=JSON.parse(load("src")||"null");}catch(e){}
  if(src&&src.gps&&load("ex")!=="1"){build(src);fromHash();render();}else{render();}
  syncSheet(true).then(()=>fromHash());
})();
</script>
